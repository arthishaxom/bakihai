<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BakiHai sync harness</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;
      }

      #status {
        font-weight: 600;
      }

      #errors {
        color: #b00020;
      }

      li {
        margin: 0.25rem 0;
      }
    </style>

  <body>
    <h1>BakiHai sync harness</h1>

    <ul id="entries" data-testid="entries"></ul>
    <script type="module" src="./main.ts"></script>
